name: Verify NORYN
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      NORYN_NO_MCP: '1'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libasound2-dev libx11-dev libxext-dev libxinerama-dev libxrandr-dev libxcursor-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev xvfb
      - name: Build VST3, standalone and validation executable
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build --target Noryn_All NorynSmoke -j2
      - name: Verify audio, knobs, routing, sequencer, scales and UI
        run: |
          mkdir -p /tmp/noryn-validation
          xvfb-run -a build/NorynSmoke_artefacts/Release/NorynSmoke /tmp/noryn-validation
      - name: Verify MCP package
        working-directory: mcp
        run: |
          npm ci
          npm run check
          npm test
          node server/stdio-smoke.mjs
